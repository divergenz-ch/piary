<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Piary: record face fixtures</title>
		<style>
			body { font: 16px/1.5 -apple-system, sans-serif; margin: 32px; color: #16181d; background: #fff; }
			#count { font: 13px ui-monospace, monospace; color: #6b7280; }
			#say { font-size: 34px; font-weight: 700; line-height: 1.2; margin: 24px 0 12px; min-height: 84px; }
			#how { font-size: 20px; color: #374151; min-height: 60px; white-space: pre-wrap; }
			#now { font-size: 56px; font-weight: 800; margin: 28px 0; min-height: 70px; }
			#now[data-tone="go"] { color: #15803d; }
			#now[data-tone="wait"] { color: #b45309; }
			#type { display: none; width: 100%; height: 120px; font: 18px/1.4 -apple-system, sans-serif; padding: 8px; box-sizing: border-box; }
			#state { font: 13px ui-monospace, monospace; color: #6b7280; margin-top: 24px; white-space: pre-wrap; }
		</style>
	</head>
	<body>
		<div id="count"></div>
		<div id="say">Starting the camera…</div>
		<div id="how"></div>
		<div id="now"></div>
		<textarea id="type" spellcheck="false"></textarea>
		<div id="state"></div>
		<script type="module" src="./face/record.ts"></script>
	</body>
</html>
