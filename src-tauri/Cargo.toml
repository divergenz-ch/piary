[package]
name = "piary"
version = "0.0.1"
edition = "2021"
description = "Piary — one canvas, not a chat"
license = "PolyForm-Noncommercial-1.0.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
notify = "8.2.0"
portable-pty = "0.9.0"
libc = "0.2.190"
tauri-plugin-wdio-webdriver = { version = "1.5.0", optional = true }
signal-hook = { version = "0.4.4", default-features = false, features = ["iterator"] }
tauri-plugin-dialog = "=2.8.4"
zip = { version = "=9.6.0", default-features = false, features = ["deflate-flate2"] }
# The menu bar's own key equivalents, read back from AppKit: macOS moves a
# shortcut to another key under some keyboard layouts and tells the app
# nothing (ADR 0051). Ranges, not pins: these must stay the versions Tauri
# resolves, or the binary carries two copies.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSMenu", "NSMenuItem", "NSEvent", "NSPrintInfo"] }

[profile.release]
# A smaller binary matters here: the bundle size is half of why the shell is
# Tauri at all (ADR 0014).
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[features]
# The embedded WebDriver server, for driving the real app from a test
# (docs/TEST_ARCHITECTURE.md §6). Off by default and refused in a release
# build: it is an UNAUTHENTICATED WebDriver server on 127.0.0.1:4445, so
# shipping it would hand anyone on the machine the app's whole IPC surface.
e2e = ["dep:tauri-plugin-wdio-webdriver"]
